<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Opportunity Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .hero { background: linear-gradient(135deg, #0d6efd, #0a58ca); color: white; padding: 2rem 0; }
        .card-hover:hover { transform: translateY(-3px); transition: all 0.2s ease-in-out; }
    </style>
</head>
<body>

    <div class="hero shadow-sm mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-journal-bookmark-fill me-2"></i>Research Opportunity Portal</h2>
                <p class="mb-0 text-white-50">Centralized platform for university research positions</p>
            </div>
            <button class="btn btn-light fw-bold text-primary" data-bs-toggle="modal" data-bs-target="#opportunityModal" onclick="resetForm()">
                <i class="bi bi-plus-circle-fill me-1"></i> Post Opportunity
            </button>
        </div>
    </div>

    <div class="container mb-5">
        <div id="alertContainer"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="text-secondary mb-0">Active Opportunities</h4>
            <button class="btn btn-outline-secondary btn-sm" onclick="fetchOpportunities()">
                <i class="bi bi-arrow-clockwise"></i> Refresh
            </button>
        </div>

        <div id="opportunitiesGrid" class="row g-4">
            <!-- Cards dynamically inserted here -->
        </div>
    </div>

    <!-- Create / Edit Modal -->
    <div class="modal fade" id="opportunityModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalTitle">Post Research Opportunity</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="opportunityForm" class="needs-validation" novalidate>
                        <input type="hidden" id="opportunityId">

                        <div class="mb-3">
                            <label for="title" class="form-label fw-semibold">Research Title *</label>
                            <input type="text" class="form-control" id="title" required>
                            <div class="invalid-feedback">Please enter a title.</div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="faculty_name" class="form-label fw-semibold">Faculty Name *</label>
                                <input type="text" class="form-control" id="faculty_name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="department" class="form-label fw-semibold">Department *</label>
                                <input type="text" class="form-control" id="department" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="research_area" class="form-label fw-semibold">Research Area *</label>
                                <input type="text" class="form-control" id="research_area" required>
                            </div>
                            <div class="col-md-3">
                                <label for="available_positions" class="form-label fw-semibold">Positions *</label>
                                <input type="number" class="form-control" id="available_positions" min="0" value="1" required>
                            </div>
                            <div class="col-md-3">
                                <label for="status" class="form-label fw-semibold">Status *</label>
                                <select class="form-select" id="status" required>
                                    <option value="Open">Open</option>
                                    <option value="Closed">Closed</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="application_deadline" class="form-label fw-semibold">Application Deadline *</label>
                            <input type="date" class="form-control" id="application_deadline" required>
                        </div>

                        <div class="mb-3">
                            <label for="required_skills" class="form-label fw-semibold">Required Skills *</label>
                            <input type="text" class="form-control" id="required_skills" required placeholder="e.g. Python, C++, PyTorch">
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold">Description *</label>
                            <textarea class="form-control" id="description" rows="3" required></textarea>
                        </div>

                        <div class="modal-footer px-0 pb-0">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary" id="saveBtn">Save Opportunity</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- View Details Modal -->
    <div class="modal fade" id="viewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="viewTitle">Opportunity Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="viewModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
